name: Publish existing release tag

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-existing-tag.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        default: '1.0.4'

permissions:
  contents: read

concurrency:
  group: publish-existing-${{ inputs.tag || '1.0.4' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || '1.0.4' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || '1.0.4' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate existing release source
        run: |
          node -e 'if (process.env.RELEASE_TAG !== require("./manifest.json").version) throw new Error("Tag must equal manifest version")'
          test -f "docs/performance/$RELEASE_TAG.md"
          test -f "docs/performance/$RELEASE_TAG-samples.json"
          npm ci
          npm run check
          npm test
          npm run build
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/vaultbranch/main.js
            dist/vaultbranch/manifest.json
            dist/vaultbranch/styles.css
      - name: Verify provenance and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in main.js manifest.json styles.css; do
            gh attestation verify "dist/vaultbranch/$file" --repo "$GITHUB_REPOSITORY"
          done
          release_sha=$(git rev-parse HEAD)
          cp RELEASE_NOTES.md "$RUNNER_TEMP/release-notes.md"
          printf '\nRelease tag: `%s`\n\nRelease commit: [%s](%s/%s/commit/%s)\n' \
            "$RELEASE_TAG" "$release_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$release_sha" \
            >> "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              dist/vaultbranch/main.js \
              dist/vaultbranch/manifest.json \
              dist/vaultbranch/styles.css \
              --repo "$GITHUB_REPOSITORY" \
              --title "VaultBranch $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
          mkdir "$RUNNER_TEMP/release-download"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release-download" \
            --pattern main.js --pattern manifest.json --pattern styles.css
          for file in main.js manifest.json styles.css; do
            cmp "dist/vaultbranch/$file" "$RUNNER_TEMP/release-download/$file"
          done
