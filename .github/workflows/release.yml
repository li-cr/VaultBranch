name: Build and release

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vaultbranch
          path: dist/vaultbranch/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vaultbranch
          path: dist/vaultbranch
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== require("./manifest.json").version) throw new Error("Tag must equal manifest version")'
      - name: Create installable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          zip -r vaultbranch.zip vaultbranch
          cd ..
          gh release create "$RELEASE_TAG" \
            dist/vaultbranch/main.js \
            dist/vaultbranch/manifest.json \
            dist/vaultbranch/styles.css \
            dist/vaultbranch.zip \
            --title "VaultBranch $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
