name: Build and release

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Attest release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/vaultbranch/main.js
            dist/vaultbranch/manifest.json
            dist/vaultbranch/styles.css
      - name: Verify attestations
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in main.js manifest.json styles.css; do
            gh attestation verify "dist/vaultbranch/$file" --repo "$GITHUB_REPOSITORY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vaultbranch
          path: dist/vaultbranch/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vaultbranch
          path: dist/vaultbranch
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== require("./manifest.json").version) throw new Error("Tag must equal manifest version")'
      - name: Create installable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp RELEASE_NOTES.md "$RUNNER_TEMP/vaultbranch-release-notes.md"
          printf '\nRelease tag: `%s`\n\nRelease commit: [%s](%s/%s/commit/%s)\n' \
            "$RELEASE_TAG" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            >> "$RUNNER_TEMP/vaultbranch-release-notes.md"
          gh release create "$RELEASE_TAG" \
            dist/vaultbranch/main.js \
            dist/vaultbranch/manifest.json \
            dist/vaultbranch/styles.css \
            --title "VaultBranch $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/vaultbranch-release-notes.md" \
            --verify-tag
